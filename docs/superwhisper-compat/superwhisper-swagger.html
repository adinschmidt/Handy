<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Superwhisper API — Unofficial Observed Specification</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        background: #f7f7f8;
      }

      .notice {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 12px 20px;
        border-bottom: 1px solid #dedee3;
        background: #fff9db;
        color: #3f3a21;
        font-size: 14px;
        line-height: 1.45;
      }

      .notice strong {
        margin-right: 6px;
      }

      .swagger-ui .topbar {
        display: none;
      }

      .swagger-ui .info {
        margin: 34px 0 24px;
      }
    </style>
  </head>
  <body>
    <div class="notice">
      <strong>Unofficial reverse-engineered specification.</strong>
      Check each operation’s <code>x-evidence</code> field before relying on it.
      Interactive submission is disabled to avoid accidental API calls.
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      window.addEventListener("load", () => {
        window.ui = SwaggerUIBundle({
          url: "./superwhisper-api.openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          docExpansion: "list",
          filter: true,
          displayRequestDuration: true,
          showExtensions: true,
          showCommonExtensions: true,
          persistAuthorization: false,
          supportedSubmitMethods: [],
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset,
          ],
          layout: "StandaloneLayout",
        });
      });
    </script>
  </body>
</html>
